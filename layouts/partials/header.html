<!-- For more information, visit: https://design-system.canada.ca/en/components/header/ -->
<gcds-header
  lang="{{ .Lang }}"
  lang-href="{{ (index .Translations 0).Permalink }}"
  skip-to-href="#main-content">
  {{- if not .Site.Params.hide_search -}}
  {{ partial "search" . }}
  {{- end -}}
  {{ partial "top-navigation" . }}
  {{ partial "breadcrumb" . }}
</gcds-header>
